name: USTA brand and product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  brand-and-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/check.mjs
      - run: python3 -B scripts/check_brand.py --dist . --css styles.css
